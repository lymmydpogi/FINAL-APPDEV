# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# --- Faster builds (dev) ---
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# One ABI for daily dev (~4× less native compile).
# Match your emulator/device ABI (adb shell getprop ro.product.cpu.abi):
#   x86_64 AVD (common on Windows/Intel): x86_64
#   arm64 AVD (Apple Silicon / many physical phones): arm64-v8a
# Release / all devices: npm run android:release
reactNativeArchitectures=x86_64

# AndroidX
android.useAndroidX=true

# New Architecture (TurboModules / Fabric)
newArchEnabled=true

# Hermes
hermesEnabled=true

edgeToEdgeEnabled=false

MYAPP_UPLOAD_STORE_FILE=releaseMe.keystore
MYAPP_UPLOAD_KEY_ALIAS=key0
MYAPP_UPLOAD_STORE_PASSWORD=admin123
MYAPP_UPLOAD_KEY_PASSWORD=admin123
